<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>For you</title>

  <!-- Link preview (what she sees when you send the link in a chat) -->
  <meta name="description" content="Open me." />
  <meta property="og:title" content="For you" />
  <meta property="og:description" content="Open me." />
  <meta name="theme-color" content="#07060b" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='18' fill='%23c084fc'/></svg>" />

  <!-- Fonts: Inter (clean sans-serif) + Cormorant Garamond italic (stylized keywords) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,400;1,500;1,600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS (CDN) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    /* =====================================================================
       COLORS & FONTS — change them here, they apply everywhere.
       Then use them in classes: text-neon, border-neon/40, bg-ember, ...
       ===================================================================== */
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            night: '#07060b',   // page background
            neon:  '#c084fc',   // soft electric violet (main accent)
            ember: '#e11d48',   // deep red (secondary accent)
            mist:  '#d4d4d8',   // body text
          },
          fontFamily: {
            sans:   ['Inter', 'system-ui', 'sans-serif'],
            script: ['"Cormorant Garamond"', 'Georgia', 'serif'],
          },
        },
      },
    };
  </script>

  <style>
    /* ---------- Base ---------- */
    html, body { height: 100%; }
    body {
      background: #07060b;
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior: none;
    }

    /* ---------- Ambient glowing orbs in the background ---------- */
    .orb {
      position: absolute;
      border-radius: 9999px;
      filter: blur(80px);
      opacity: .35;
      animation: drift 18s ease-in-out infinite alternate;
    }
    @keyframes drift {
      from { transform: translate(0, 0) scale(1); }
      to   { transform: translate(40px, -60px) scale(1.15); }
    }

    /* ---------- Generic fade helpers (used by the JS) ---------- */
    .fade        { transition: opacity .9s ease, transform .9s ease, filter .9s ease; }
    .is-hidden   { opacity: 0; transform: translateY(12px); filter: blur(4px); pointer-events: none; }

    /* ---------- Step 1 button: soft breathing glow ---------- */
    .glow-btn { animation: breathe 3.5s ease-in-out infinite; }
    @keyframes breathe {
      0%, 100% { box-shadow: 0 0 0 0 rgba(192,132,252,0), 0 0 24px rgba(192,132,252,.10); }
      50%      { box-shadow: 0 0 0 1px rgba(192,132,252,.25), 0 0 40px rgba(192,132,252,.25); }
    }

    /* ---------- Typewriter caret ---------- */
    .caret {
      display: inline-block;
      width: 2px; height: 1.1em;
      margin-left: 2px;
      vertical-align: -0.15em;
      background: #c084fc;
      animation: blink 1s steps(1) infinite;
    }
    @keyframes blink { 50% { opacity: 0; } }

    /* ---------- "Yes" button: discreet pulse ---------- */
    .pulse { animation: pulse 2.2s ease-in-out infinite; }
    @keyframes pulse {
      0%, 100% { transform: scale(1);    box-shadow: 0 0 0 0 rgba(192,132,252,.45); }
      50%      { transform: scale(1.05); box-shadow: 0 0 0 10px rgba(192,132,252,0); }
    }

    /* ---------- "No" button: smooth escape ---------- */
    #noBtn { transition: left .35s cubic-bezier(.2,.9,.3,1.2), top .35s cubic-bezier(.2,.9,.3,1.2), transform .2s; touch-action: none; }

    /* ---------- Final warm flash ---------- */
    #warmth {
      background: radial-gradient(circle at 50% 55%, rgba(225,29,72,.35), rgba(192,132,252,.18) 40%, transparent 70%);
      transition: opacity 2.5s ease;
    }

    @media (prefers-reduced-motion: reduce) {
      .orb, .glow-btn, .pulse { animation: none; }
    }
  </style>
</head>

<body class="font-sans text-mist antialiased overflow-hidden select-none">

  <!-- Background ambiance -->
  <div class="fixed inset-0 -z-10 overflow-hidden" aria-hidden="true">
    <div class="orb w-72 h-72 bg-neon -top-20 -left-20"></div>
    <div class="orb w-80 h-80 bg-ember -bottom-24 -right-24" style="animation-delay:-6s; opacity:.22"></div>
    <div class="absolute inset-0 bg-[radial-gradient(ellipse_at_center,transparent_0%,#07060b_75%)]"></div>
  </div>

  <!-- Particles canvas (final celebration) -->
  <canvas id="particles" class="fixed inset-0 pointer-events-none z-0"></canvas>
  <!-- Warm glow overlay (final celebration) -->
  <div id="warmth" class="fixed inset-0 pointer-events-none opacity-0 z-0"></div>

  <main class="relative z-10 min-h-[100dvh] flex items-center justify-center px-6 py-12">

    <!-- ============ STEP 1 — The hook ============ -->
    <section id="step1" class="fade text-center">
      <button id="startBtn"
        class="glow-btn group rounded-full border border-neon/40 bg-white/[0.02] px-7 py-4 text-sm sm:text-base tracking-wide text-mist backdrop-blur
               hover:border-neon/80 hover:bg-neon/[0.06] focus:outline-none focus-visible:ring-2 focus-visible:ring-neon/60 transition-colors duration-500">
        <!-- Text is filled by JS from CONFIG.buttonText / CONFIG.nickname -->
        <span id="startText"></span>
      </button>
      <p class="mt-6 text-[11px] uppercase tracking-[0.35em] text-white/20">tap</p>
    </section>

    <!-- ============ STEP 2 + 3 — The confession & the test ============ -->
    <section id="step2" class="fade is-hidden hidden w-full max-w-xl text-center">

      <!-- Typewriter text lands here -->
      <p id="typed" class="text-lg sm:text-2xl leading-relaxed sm:leading-relaxed font-light text-mist min-h-[6em]"></p>

      <!-- STEP 3 — The question -->
      <div id="step3" class="fade is-hidden mt-12">
        <p id="question" class="font-script text-3xl sm:text-4xl text-white"></p>

        <div id="buttons" class="relative mt-8 flex items-center justify-center gap-5 h-16">
          <button id="yesBtn"
            class="pulse rounded-full bg-neon px-9 py-3 text-sm font-medium tracking-wide text-night
                   hover:bg-white focus:outline-none focus-visible:ring-2 focus-visible:ring-white/70 transition-colors">
            Yes
          </button>
          <button id="noBtn" tabindex="-1"
            class="rounded-full border border-white/15 px-9 py-3 text-sm tracking-wide text-white/60 bg-night/70 backdrop-blur">
            No
          </button>
        </div>
      </div>
    </section>

    <!-- ============ FINAL — The reward ============ -->
    <section id="final" class="fade is-hidden hidden absolute inset-0 flex flex-col items-center justify-center px-6 text-center">
      <p id="finalText" class="text-3xl sm:text-5xl font-light text-white leading-snug"></p>
    </section>
  </main>

  <script>
    /* =====================================================================
       ✏️  CONFIG — EDIT YOUR TEXTS HERE
       Tip: wrap a word in *asterisks* to render it in the stylized font
       with a neon glow (e.g. "*Kitty*").
       ===================================================================== */
    const CONFIG = {
      nickname:   'Kitty',
      buttonText: 'I have something to tell you, *{nickname}*...',

      message:
        "I built this just to remind you of something important: you *truly matter* to me. " +
        "Beyond the games, the teasing, and the distance between us, the time we spend together " +
        "is my favorite part of the day. You are never just a passing thought. " +
        "You are *incredibly special* to me, and I wanted to make sure you knew it.",

      question:  'Do you forgive me for overthinking today?',
      finalText: 'Good *girl*. Ready for our next *game*?',

      // Little phrases the "No" button cycles through while it runs away
      noTexts: ['No', 'Nope', 'Too slow', 'Nice try', 'Not an option', 'Just say yes', '😏'],

      typingSpeed: 45,   // ms per letter (lower = faster)
      punctuationPause: 380, // extra pause after , . ! ?
    };

    /* ---------------------------------------------------------------------
       Helpers
       --------------------------------------------------------------------- */
    const $ = (id) => document.getElementById(id);
    const KEYWORD_CLASS = 'font-script italic text-neon text-[1.2em] [text-shadow:0_0_18px_rgba(192,132,252,.55)]';

    // Turns "hello *you*" into [{text:'hello ', key:false}, {text:'you', key:true}]
    function parse(str) {
      return str.split(/(\*[^*]+\*)/).filter(Boolean).map((s) =>
        s.startsWith('*') ? { text: s.slice(1, -1), key: true } : { text: s, key: false }
      );
    }

    // Renders parsed text instantly (no typing)
    function render(el, str) {
      el.innerHTML = '';
      parse(str).forEach((seg) => {
        const span = document.createElement('span');
        if (seg.key) span.className = KEYWORD_CLASS;
        span.textContent = seg.text;
        el.appendChild(span);
      });
    }

    const show = (el) => { el.classList.remove('hidden'); requestAnimationFrame(() => requestAnimationFrame(() => el.classList.remove('is-hidden'))); };
    const hide = (el) => { el.classList.add('is-hidden'); setTimeout(() => el.classList.add('hidden'), 900); };
    const wait = (ms) => new Promise((r) => setTimeout(r, ms));

    /* ---------------------------------------------------------------------
       STEP 1 — The hook
       --------------------------------------------------------------------- */
    render($('startText'), CONFIG.buttonText.replace('{nickname}', CONFIG.nickname));

    $('startBtn').addEventListener('click', async () => {
      $('startBtn').disabled = true;
      hide($('step1'));
      await wait(1000);
      show($('step2'));
      await wait(600);
      await typewriter($('typed'), CONFIG.message);
      await wait(700);
      render($('question'), CONFIG.question);
      show($('step3'));
    }, { once: true });

    /* ---------------------------------------------------------------------
       STEP 2 — Typewriter effect
       --------------------------------------------------------------------- */
    async function typewriter(el, str) {
      el.innerHTML = '';
      const caret = document.createElement('span');
      caret.className = 'caret';
      el.appendChild(caret);

      for (const seg of parse(str)) {
        const span = document.createElement('span');
        if (seg.key) span.className = KEYWORD_CLASS;
        el.insertBefore(span, caret);

        for (const ch of seg.text) {
          span.textContent += ch;
          // Slight human-like randomness + pauses on punctuation
          let delay = CONFIG.typingSpeed * (0.6 + Math.random() * 0.8);
          if (/[,.!?]/.test(ch)) delay += CONFIG.punctuationPause;
          await wait(delay);
        }
      }
      await wait(1200);
      caret.remove();
    }

    /* ---------------------------------------------------------------------
       STEP 3 — The "No" button that can't be caught
       --------------------------------------------------------------------- */
    const noBtn = $('noBtn');
    let noIndex = 0;
    let escaped = false; // becomes position:fixed after the first escape

    function flee(px, py) {
      const pad = 16;
      const r = noBtn.getBoundingClientRect();

      // First escape: detach the button from the layout so it can roam freely
      if (!escaped) {
        escaped = true;
        // Invisible placeholder so the "Yes" button doesn't shift under her finger
        const ghost = document.createElement('span');
        ghost.style.cssText = `display:inline-block;width:${r.width}px;height:${r.height}px`;
        noBtn.after(ghost);
        noBtn.style.position = 'fixed';
        noBtn.style.left = r.left + 'px';
        noBtn.style.top = r.top + 'px';
        noBtn.style.zIndex = 50;
        noBtn.offsetWidth; // force reflow so the transition kicks in
      }

      // Change its text for extra teasing
      noIndex = (noIndex + 1) % CONFIG.noTexts.length;
      noBtn.textContent = CONFIG.noTexts[noIndex];

      const w = noBtn.offsetWidth, h = noBtn.offsetHeight;
      const maxX = window.innerWidth - w - pad;
      const maxY = window.innerHeight - h - pad;

      // Pick a random spot far enough from the finger / cursor
      let x, y, tries = 0;
      do {
        x = pad + Math.random() * Math.max(0, maxX - pad);
        y = pad + Math.random() * Math.max(0, maxY - pad);
        tries++;
      } while (Math.hypot(x + w / 2 - px, y + h / 2 - py) < 180 && tries < 40);

      noBtn.style.left = x + 'px';
      noBtn.style.top = y + 'px';
    }

    // Desktop: run away as soon as the cursor gets close
    document.addEventListener('pointermove', (e) => {
      if ($('step3').classList.contains('is-hidden') || e.pointerType === 'touch') return;
      const r = noBtn.getBoundingClientRect();
      const dist = Math.hypot(e.clientX - (r.left + r.width / 2), e.clientY - (r.top + r.height / 2));
      if (dist < Math.max(r.width, r.height) * 0.9) flee(e.clientX, e.clientY);
    });

    // Mobile + fallback: escape before a tap or click can ever land
    ['pointerdown', 'touchstart', 'mouseenter', 'focus'].forEach((evt) =>
      noBtn.addEventListener(evt, (e) => {
        if (e.cancelable) e.preventDefault();
        const p = e.touches ? e.touches[0] : e;
        const r = noBtn.getBoundingClientRect();
        flee(p.clientX ?? r.left, p.clientY ?? r.top);
      }, { passive: false })
    );
    noBtn.addEventListener('click', (e) => { e.preventDefault(); flee(innerWidth / 2, innerHeight / 2); });

    // Keep it on screen if the phone rotates
    window.addEventListener('resize', () => { if (escaped) flee(innerWidth / 2, innerHeight / 2); });

    /* ---------------------------------------------------------------------
       FINAL — "Yes" → glowing particles + warm fade + last message
       --------------------------------------------------------------------- */
    $('yesBtn').addEventListener('click', async (e) => {
      const r = e.currentTarget.getBoundingClientRect();
      burst(r.left + r.width / 2, r.top + r.height / 2);
      $('warmth').style.opacity = 1;
      noBtn.style.transition = 'opacity .6s';
      noBtn.style.opacity = 0;
      noBtn.style.pointerEvents = 'none';

      hide($('step2'));
      await wait(1100);
      render($('finalText'), CONFIG.finalText);
      show($('final'));
      setTimeout(() => ($('warmth').style.opacity = 0.55), 2500);
    }, { once: true });

    /* ---------------------------------------------------------------------
       Particles engine (tiny, canvas-based)
       --------------------------------------------------------------------- */
    const canvas = $('particles');
    const ctx = canvas.getContext('2d');
    const COLORS = ['192,132,252', '225,29,72', '244,114,182', '255,255,255']; // neon, ember, pink, white
    let particles = [];
    let ambient = false;

    function resize() {
      const dpr = window.devicePixelRatio || 1;
      canvas.width = innerWidth * dpr;
      canvas.height = innerHeight * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    resize();
    window.addEventListener('resize', resize);

    function spawn(x, y, burstMode) {
      const angle = Math.random() * Math.PI * 2;
      const speed = burstMode ? 1 + Math.random() * 5 : 0.2 + Math.random() * 0.6;
      particles.push({
        x, y,
        vx: Math.cos(angle) * speed,
        vy: burstMode ? Math.sin(angle) * speed - 1 : -(0.3 + Math.random() * 0.8),
        r: 1 + Math.random() * 2.5,
        life: 0,
        max: burstMode ? 90 + Math.random() * 80 : 220 + Math.random() * 200,
        c: COLORS[(Math.random() * COLORS.length) | 0],
        wobble: Math.random() * Math.PI * 2,
      });
    }

    function burst(x, y) {
      for (let i = 0; i < 140; i++) spawn(x, y, true);
      ambient = true; // then keep soft fireflies floating up
      if (!running) loop();
    }

    let running = false;
    function loop() {
      running = true;
      ctx.clearRect(0, 0, innerWidth, innerHeight);

      if (ambient && particles.length < 90 && Math.random() < 0.5) {
        spawn(Math.random() * innerWidth, innerHeight + 10, false);
      }

      particles = particles.filter((p) => p.life < p.max);
      for (const p of particles) {
        p.life++;
        p.wobble += 0.03;
        p.x += p.vx + Math.sin(p.wobble) * 0.3;
        p.y += p.vy;
        p.vx *= 0.985;
        p.vy *= 0.985;
        p.vy -= 0.01; // float upward

        const alpha = Math.sin((p.life / p.max) * Math.PI); // fade in & out
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(${p.c},${alpha})`;
        ctx.shadowColor = `rgba(${p.c},${alpha})`;
        ctx.shadowBlur = 12;
        ctx.fill();
      }
      requestAnimationFrame(loop);
    }
  </script>
</body>
</html>
